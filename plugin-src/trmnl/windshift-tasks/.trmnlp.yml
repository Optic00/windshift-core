# Local dev config for `trmnlp serve`. Never committed with real secrets —
# the token is read from the WINDSHIFT_TOKEN environment variable.
---
watch:
  - .trmnlp.yml
  - src

# Values for the custom fields declared in src/settings.yml. On the hosted
# service these come from the plugin's settings form instead.
custom_fields:
  windshift_url: '{{ env.WINDSHIFT_URL }}'
  api_token: '{{ env.WINDSHIFT_TOKEN }}'
  task_query: assignee = currentUser() AND status != Done
  max_items: 20

variables:
  trmnl: {}
