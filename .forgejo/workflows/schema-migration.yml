name: Schema Migration Guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  schema-migration-pairing:
    name: Fresh schema / upgrade migration pairing
    runs-on: docker
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test guard behavior
        run: bash scripts/check-schema-migration-pairing_test.sh

      - name: Check changed schema and migrations
        env:
          PR_BASE_SHA: ${{ forgejo.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ forgejo.event.before }}
        run: |
          if [ -n "$PR_BASE_SHA" ]; then
            scripts/check-schema-migration-pairing.sh --range "$PR_BASE_SHA...HEAD"
          elif [ -n "$PUSH_BEFORE_SHA" ] && [ "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            scripts/check-schema-migration-pairing.sh --range "$PUSH_BEFORE_SHA...HEAD"
          else
            scripts/check-schema-migration-pairing.sh --commit HEAD
          fi
