key: milestone_on_release_branch
name: Create planning milestone from release branch
description: |
  When a branch matching the workspace repository's milestone_branch_pattern
  (default release/*) appears, upsert a workspace milestone keyed by
  {{ref.short}} (so "release/2.0" becomes milestone "2.0"). New milestones
  start in "planning"; an existing milestone with the same external_key
  is left alone so repeated pushes don't downgrade an in-progress release.

  Pair with "Promote milestone when matching tag appears" so the tag
  promotes this milestone instead of creating a parallel one.
category: SCM automation
trigger_type: scm_release_branch_created
trigger_config: {}
nodes:
  - id: trigger
    node_type: trigger
    node_config: {}
    position:
      x: 0
      y: 0
  - id: create
    node_type: create_milestone
    node_config:
      name_template: "Release {{ref.short}}"
      upsert_key_template: "{{ref.short}}"
      status_on_branch: planning
      status_on_tag: in-progress
      attach_release_on_tag: false
      attach_commit_issues: false
    position:
      x: 280
      y: 0
edges:
  - source_node_id: trigger
    target_node_id: create
    edge_type: default
