      type: object
    windshift_internal_restapi_v1_handlers.UserResponse:
      properties:
        avatar_url:
          type: string
        created_at:
          type: string
        email:
          type: string
        first_name:
          type: string
        full_name:
          type: string
        id:
          type: integer
        is_active:
          type: boolean
        language:
          type: string
        last_name:
          type: string
        timezone:
          type: string
        username:
          type: string
      type: object
  securitySchemes:
    BearerAuth:
      description: API bearer token in the form `Bearer crw_*`. Token scopes are checked
        per route.
      in: header
      name: Authorization
      type: apiKey
info:
  contact: {}
  description: 'Public REST API for Windshift work-management. Authenticate every
    request with a bearer token (`Authorization: Bearer crw_*`). Tokens are scoped
    per route — see each operation''s `security` block for the required scopes.'
  title: Windshift REST API
  version: "1"
openapi: 3.0.3
paths:
  /admin/api-tokens:
    get:
      description: System-admin only. Optionally filter to a single user via `user_id`.
      parameters:
      - description: Filter to tokens owned by this user
        in: query
        name: user_id
        schema:
          type: integer
      - description: Page number (1-based)
        in: query
        name: page
        schema:
          type: integer
      - description: Items per page (max 100)
        in: query
        name: limit
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/handlers.PaginatedResponse'
                - properties:
                    data:
                      items:
                        $ref: '#/components/schemas/models.APIToken'
                      type: array
                  type: object
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Invalid user_id
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Caller is not a system admin or token lacks the admin:api-tokens:read
            scope
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: List all API tokens (admin)
      tags:
      - admin
  /admin/api-tokens/{id}:
    delete:
      description: System-admin only.
      parameters:
      - description: Token ID
        in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        "204":
          description: Token revoked
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Invalid token ID
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Caller is not a system admin or token lacks the admin:api-tokens:write
            scope
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Token not found
      security:
      - BearerAuth: []
      summary: Revoke an API token (admin)
      tags:
      - admin
  /admin/audit-logs:
    get:
      description: System-admin only. Filter by action type, resource type, user,
        and timestamp range.
      parameters:
      - description: Exact-match filter on action type
        in: query
        name: action_type
        schema:
          type: string
      - description: Exact-match filter on resource type
        in: query
        name: resource_type
        schema:
          type: string
      - description: Filter to actions performed by this user
        in: query
        name: user_id
        schema:
          type: integer
      - description: Start of timestamp range (RFC3339)
        in: query
        name: from
        schema:
          type: string
      - description: End of timestamp range (RFC3339)
        in: query
        name: to
        schema:
          type: string
      - description: Page number (1-based)
        in: query
        name: page
        schema:
          type: integer
      - description: Items per page (max 100)
        in: query
        name: limit
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/handlers.PaginatedResponse'
                - properties:
                    data:
                      items:
                        $ref: '#/components/schemas/handlers.AuditLogEntryResponse'
                      type: array
                  type: object
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Invalid filter parameter
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Caller is not a system admin or token lacks the admin:audit-logs:read
            scope
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: List audit log entries (admin)
      tags:
      - admin
  /admin/audit-logs/since:
    get:
      description: 'System-admin only. Returns audit log rows with id > after_id in
        ascending id order, capped at limit. Designed for external streaming consumers
        (e.g. SIEM exporters): persist next_after_id between calls and pass it back
        as after_id; rows are never re-delivered. Use after_id=0 to start from the
        beginning.'
      parameters:
      - description: Strict-greater-than cursor (default 0 = from beginning)
        in: query
        name: after_id
        schema:
          type: integer
      - description: Max rows to return (default 500, capped at 1000)
        in: query
        name: limit
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/windshift_internal_restapi_v1_handlers.AuditLogStreamResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Invalid after_id or limit
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Caller is not a system admin or token lacks the admin:audit-logs:read
            scope
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Tail audit log entries via cursor (admin)
      tags:
      - admin
  /admin/groups:
    get:
      description: System-admin only.
      parameters:
      - description: Page number (1-based)
        in: query
        name: page
        schema:
          type: integer
      - description: Items per page (max 100)
        in: query
        name: limit
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/handlers.PaginatedResponse'
                - properties:
                    data:
                      items:
                        $ref: '#/components/schemas/handlers.AdminGroupResponse'
                      type: array
                  type: object
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Caller is not a system admin or token lacks the admin:groups:read
            scope
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: List groups (admin)
      tags:
      - admin
    post:
      description: System-admin only.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/handlers.AdminGroupCreateRequest'
        description: Group to create
        required: true
        x-originalParamName: body
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.AdminGroupResponse'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Invalid request body or missing name
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Caller is not a system admin or token lacks the admin:groups:write
            scope
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Create a group (admin)
      tags:
      - admin
  /admin/groups/{id}:
    delete:
      description: System-admin only. Cascades through group_members.
      parameters:
      - description: Group ID
        in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        "204":
          description: Group deleted
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Invalid group ID
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Caller is not a system admin or token lacks the admin:groups:write
            scope
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Group not found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Delete a group (admin)
      tags:
      - admin
    put:
      description: System-admin only.
      parameters:
      - description: Group ID
        in: path
        name: id
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/handlers.AdminGroupUpdateRequest'
        description: Fields to update
        required: true
        x-originalParamName: body
      responses:
        "204":
          description: Group updated
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Invalid group ID, request body, or no fields to update
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Caller is not a system admin or token lacks the admin:groups:write
            scope
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Group not found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Update a group (admin)
      tags:
      - admin
  /admin/users:
    get:
      description: System-admin only. Returns the full user record including email,
        timezone, language, and group memberships.
      parameters:
      - description: Page number (1-based)
        in: query
        name: page
        schema:
          type: integer
      - description: Items per page (max 100)
        in: query
        name: limit
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/handlers.PaginatedResponse'
                - properties:
                    data:
                      items:
                        $ref: '#/components/schemas/handlers.AdminUserResponse'
                      type: array
                  type: object
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Caller is not a system admin or token lacks the admin:users:read
            scope
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: List users (admin)
      tags:
      - admin
  /admin/users/{id}:
    put:
      description: System-admin only.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/handlers.AdminUserUpdateRequest'
        description: Fields to update
        required: true
        x-originalParamName: body
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/windshift_internal_restapi_v1_handlers.UserResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Invalid user ID, request body, or no fields to update
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Caller is not a system admin or token lacks the admin:users:write
            scope
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: User not found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Update a user (admin)
      tags:
      - admin
  /attachments/{id}/download:
    get:
      parameters:
      - description: Attachment ID
        in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        "200":
          content:
            application/octet-stream:
              schema:
                format: binary
                type: string
          description: OK
        "401":
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Token lacks the items:read scope
        "404":
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Attachment not found or not visible to caller
        "500":
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Download an attachment's binary contents
      tags:
      - items
  /attachments/{id}/thumbnail:
    get:
      parameters:
      - description: Attachment ID
        in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        "200":
          content:
            image/jpeg:
              schema:
                format: binary
                type: string
          description: OK
        "401":
          content:
            image/jpeg:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Unauthorized
        "403":
          content:
            image/jpeg:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Token lacks the items:read scope
        "404":
          content:
            image/jpeg:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Attachment not found, has no thumbnail, or is not visible to
            caller
        "500":
          content:
            image/jpeg:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Download an attachment thumbnail
      tags:
      - items
  /collections:
    get:
      description: Case-insensitive substring match on collection name. Results are
        filtered to collections the caller can view.
      parameters:
      - description: Substring to match against collection name
        in: query
        name: q
        schema:
          type: string
      - description: Maximum results (default 20, max 100)
        in: query
        name: limit
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.CollectionListResponse'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Token lacks the collections:read scope
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Search collections by name
      tags:
      - collections
  /collections/{key}:
    get:
      description: '`key` is either a numeric collection id or its `public_slug`.
        Permission failures return 404 — collection existence is never leaked.'
      parameters:
      - description: Collection id (numeric) or public_slug
        in: path
        name: key
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.CollectionResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Invalid collection key
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Token lacks the collections:read scope
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Collection not found or not visible to caller
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Get a collection by id or slug
      tags:
      - collections
  /collections/{key}/items:
    get:
      description: Resolves the collection's saved QL query and returns matching items,
        gated by the caller's accessible workspaces. Permission failures return 404.
      parameters:
      - description: Collection id (numeric) or public_slug
        in: path
        name: key
        required: true
        schema:
          type: string
      - description: Page number (1-based)
        in: query
        name: page
        schema:
