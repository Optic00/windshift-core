      x-enum-varnames:
      - ActionTriggerStatusTransition
      - ActionTriggerItemCreated
      - ActionTriggerItemUpdated
      - ActionTriggerItemLinked
      - ActionTriggerManual
      - ActionTriggerSCMTagCreated
      - ActionTriggerSCMReleaseBranchCreated
    models.CapabilityType:
      enum:
      - docker_environment
      - http_client
      - llm_connection
      type: string
      x-enum-varnames:
      - CapabilityDockerEnvironment
      - CapabilityHTTPClient
      - CapabilityLLMConnection
    models.ItemDiagram:
      properties:
        created_at:
          type: string
        created_by:
          type: integer
        creator_email:
          type: string
        creator_name:
          description: Joined fields for API responses
          type: string
        diagram_data:
          description: JSON with elements, appState, files
          type: string
        id:
          type: integer
        item_id:
          type: integer
        name:
          type: string
        updated_at:
          type: string
        updated_by:
          type: integer
        updated_by_email:
          type: string
        updated_by_name:
          type: string
      type: object
    models.Label:
      properties:
        color:
          type: string
        created_at:
          type: string
        id:
          type: integer
        name:
          type: string
        updated_at:
          type: string
        workspace_id:
          type: integer
      type: object
    models.TestCase:
      properties:
        created_at:
          type: string
        estimated_duration:
          description: in seconds
          type: integer
        folder_id:
          type: integer
        folder_name:
          description: Computed fields for API responses
          type: string
        id:
          type: integer
        labels:
          items:
            $ref: '#/components/schemas/models.TestLabel'
          type: array
        name:
          type: string
        preconditions:
          type: string
        priority:
          description: low, medium, high, critical
          type: string
        sort_order:
          type: integer
        status:
          description: active, inactive, draft
          type: string
        test_steps:
          items:
            $ref: '#/components/schemas/models.TestStep'
          type: array
        title:
          type: string
        updated_at:
          type: string
        workspace_id:
          type: integer
      type: object
    models.TestLabel:
      properties:
        color:
          type: string
        created_at:
          type: string
        description:
          type: string
        id:
          type: integer
        name:
          type: string
        updated_at:
          type: string
        workspace_id:
          type: integer
      type: object
    models.TestRun:
      properties:
        assignee_avatar:
          type: string
        assignee_email:
          type: string
        assignee_id:
          description: User assigned to execute this run
          type: integer
        assignee_name:
          description: Computed fields from JOIN with users table
          type: string
        created_at:
          type: string
        ended_at:
          type: string
        id:
          type: integer
        name:
          type: string
        set_id:
          type: integer
        started_at:
          type: string
        template_id:
