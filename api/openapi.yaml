      type: object
    models.TestSet:
      properties:
        created_at:
          type: string
        description:
          type: string
        failed_runs:
          type: integer
        id:
          type: integer
        last_run_date:
          type: string
        last_run_status:
          type: string
        milestone_id:
          type: integer
        milestone_name:
          type: string
        name:
          type: string
        successful_runs:
          type: integer
        test_case_count:
          description: Test case count
          type: integer
        total_runs:
          description: Test run statistics
          type: integer
        updated_at:
          type: string
        workspace_id:
          type: integer
      type: object
    models.TestStep:
      properties:
        action:
          type: string
        created_at:
          type: string
        data:
          type: string
        expected:
          type: string
        id:
          type: integer
        step_number:
          type: integer
        test_case_id:
          type: integer
        updated_at:
          type: string
      type: object
    restapi.PaginationMeta:
      properties:
        has_more:
          type: boolean
        limit:
          type: integer
        page:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer
      type: object
    windshift_internal_restapi_v1_handlers.AuditLogStreamResponse:
      properties:
        entries:
          items:
            $ref: '#/components/schemas/handlers.AuditLogEntryResponse'
          type: array
        has_more:
          type: boolean
        next_after_id:
