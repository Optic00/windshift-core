version: "3.8"

## Docker Compose Example for main:tag with Autobuild (for Dokploy & other platforms)
services:
  windshift:
    image: ghcr.io/windshiftapp/windshift:main
    # The :main tag is mutable. Dokploy's Deploy/Reload runs `compose up -d`
    # without a prior `compose pull`, so a freshly pushed :main digest is
    # ignored and the cached image keeps running (Dokploy#3522, #2211, #945).
    # pull_policy: always forces a re-pull of the tag on every deploy.
    pull_policy: always
    restart: unless-stopped
    tmpfs:
      - /tmp:exec,size=64M
    environment:
      - BASE_URL=https://${DOMAIN}
      - PORT=8080
      - USE_PROXY=true
      - SSO_SECRET=${SSO_SECRET}
      - ATTACHMENT_PATH=/data/attachments
      - DB_TYPE=postgres
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - ALLOW_LOCAL_CONNECTIONS=true
      - CODING_AGENT_ENABLED=true
      - LOG_LEVEL=info
      - LOG_FORMAT=json
      # Web Push (VAPID). REQUIRED for mobile/PWA push notifications — without
      # both keys, push dispatch is a no-op and the "Enable notifications"
      # button silently fails. Generate ONE pair per deployment and keep it
      # stable (rotating invalidates every existing subscription):
      #   npx web-push generate-vapid-keys
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      # Optional VAPID "sub" contact (mailto: or https:). Defaults to BASE_URL.
      - VAPID_SUBJECT=${VAPID_SUBJECT:-}
    volumes:
      - windshift-data:/data
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  windshift-data: {}
  postgres-data: {}
